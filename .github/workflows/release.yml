name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish OTA package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check source privacy
        shell: pwsh
        run: |
          ./scripts/Check-PublishSafety.ps1 -Mode WorkingTree
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Check-PublishSafety.ps1 -Mode History
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Build release package
        shell: cmd
        run: build.cmd

      - name: Test the release
        shell: pwsh
        run: |
          dotnet test WinSystemHelper.sln -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tests/PublishSafety.Tests.ps1
          ./dist/WinSystemHelper.exe /queue-storage-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify OTA package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "artifacts\WinSystemHelper-ota.zip"
          if (-not (Test-Path -LiteralPath $package)) {
            throw "OTA package was not created: $package"
          }

          $items = tar -tf $package
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release package.' }
          foreach ($required in @("WinSystemHelper.exe", "WinSystemHelper.Bootstrapper.exe", "install.ps1", "README.md")) {
            if ($items -notcontains $required) {
              throw "OTA package is missing required file: $required"
            }
          }
          ./scripts/Check-PublishSafety.ps1 -Mode WorkingTree -Package $package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign OTA package
        shell: pwsh
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "artifacts\WinSystemHelper-ota.zip"
          if ($env:OTA_SIGNING_KEY) {
            ./dist/WinSystemHelper.exe /ota-sign $package
            if ($LASTEXITCODE -ne 0) { throw 'Signing the OTA package failed.' }
          }
          # The built executable is the judge: it checks the signature against the
          # public key compiled into it, exactly as an installed service will.
          ./dist/WinSystemHelper.exe /ota-verify $package
          if ($LASTEXITCODE -eq 3) {
            Write-Warning 'No release key is pinned in this build. The package is published UNSIGNED and installed services will not verify it.'
          }
          elseif ($LASTEXITCODE -ne 0) {
            throw 'This build requires signed updates, but the package has no valid signature. Check the OTA_SIGNING_KEY secret against OtaSignature.PinnedPublicKey.'
          }

      - name: Prepare Telegram update attachment
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "artifacts\WinSystemHelper-ota.zip"
          if (Test-Path -LiteralPath "$package.sig") {
            ./dist/WinSystemHelper.exe /ota-attachment $package
            if ($LASTEXITCODE -ne 0) { throw 'Preparing the Telegram update attachment failed.' }
          }

      - name: Upload GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $package = Join-Path $env:GITHUB_WORKSPACE "artifacts\WinSystemHelper-ota.zip"
          $assets = @($package)
          if (Test-Path -LiteralPath "$package.sig") {
            $assets += "$package.sig"
            $assets += [IO.Path]::ChangeExtension($package, '.telegram.zip')
          }
          $repo = "${{ github.repository }}"
          $draft = gh release view $tag --repo $repo --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0 -and $draft -eq 'true') {
            gh release upload $tag @assets --repo $repo
          }
          else {
            gh release create $tag @assets --repo $repo --verify-tag --title "WinSystemHelper $tag" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
